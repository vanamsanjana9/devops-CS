version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_type: service
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password

  backend:
    build: ./Taskflow/backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://root:password@mongodb:27017/taskflow?authSource=admin
    depends_on:
      - mongodb

  selenium-chrome:
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"
      - "7900:7900" # VNC port for debugging (optional)
    shm_size: 2gb